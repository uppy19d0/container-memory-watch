name: source-security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install semgrep==1.180.0
      - run: semgrep scan --config p/security-audit --config p/javascript --metrics=off --disable-version-check --error --json --output /tmp/semgrep-results.json .
        env:
          SEMGREP_SEND_METRICS: 'off'

name: source-security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: pipx install semgrep==1.180.0
      - run: semgrep scan --config p/security-audit --config p/javascript --metrics=off --disable-version-check --error --json --output /tmp/semgrep-results.json .
        env:
          SEMGREP_SEND_METRICS: 'off'

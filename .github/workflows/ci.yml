name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action, pinned toolchain
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: npm ci --prefix packages/node --ignore-scripts
      - run: npm run typecheck --prefix packages/node
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: npm test --prefix packages/node
        env:
          OOM_WATCH_BINARY: ${{ github.workspace }}/target/debug/oom-watch
      - run: node --test examples/cloud/monitor.test.mjs
        env:
          OOM_WATCH_BINARY: ${{ github.workspace }}/target/debug/oom-watch
      - run: npm audit --prefix packages/node --audit-level=low
      - run: npm run prepare:package --prefix packages/node
      - run: node scripts/check-release.mjs

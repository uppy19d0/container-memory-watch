apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-watch-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: memory-watch-api }
  template:
    metadata:
      labels: { app: memory-watch-api }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Replace with your verified registry image digest before applying.
          image: YOUR_REGISTRY/memory-watch-api:REPLACE_WITH_VERIFIED_RELEASE
          ports: [{ containerPort: 3000 }]
          env:
            - { name: OOM_WATCH_CGROUP_PATH, value: /sys/fs/cgroup }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: memory-watch-api
spec:
  selector: { app: memory-watch-api }
  ports: [{ port: 80, targetPort: 3000 }]
